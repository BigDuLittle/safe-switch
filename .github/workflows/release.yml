name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push tag
        if: startsWith(github.ref, 'refs/tags/') == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Download offline model
        shell: pwsh
        run: |
          $modelDir = "src-tauri/resources/models/bge-small-zh-v1.5"
          New-Item -ItemType Directory -Force -Path $modelDir
          $base = "https://huggingface.co/BAAI/bge-small-zh-v1.5/resolve/main"
          $files = @("config.json", "model.safetensors", "tokenizer.json", "tokenizer_config.json", "vocab.txt")
          foreach ($f in $files) {
            Write-Host "Downloading $f ..."
            Invoke-WebRequest -Uri "$base/$f" -OutFile "$modelDir/$f"
          }
          '{"use_pytorch_mha":true}' | Out-File -Encoding utf8 "$modelDir/ort_config.json"

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $sigFiles = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.sig"
          if (-not $sigFiles) { throw "No .sig file found" }
          $sigFile = $sigFiles | Select-Object -First 1
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()
          $exeName = [IO.Path]::GetFileNameWithoutExtension($sigFile.Name) + ".exe"
          $url = "https://github.com/BigDuLittle/safe-switch/releases/download/v$version/$exeName"
          $json = @{
            version = $version
            notes = "Safe Switch v$version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText("src-tauri/target/release/bundle/latest.json", $json, (New-Object Text.UTF8Encoding $false))
          Write-Host "latest.json generated for v$version"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}