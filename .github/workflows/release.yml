name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 3.20.4)'
        required: true
        default: '3.20.4'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push tag
        if: startsWith(github.ref, 'refs/tags/') == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Download offline model
        shell: pwsh
        run: |
          $modelDir = "src-tauri/resources/models/bge-small-zh-v1.5"
          New-Item -ItemType Directory -Force -Path $modelDir
          $base = "https://huggingface.co/BAAI/bge-small-zh-v1.5/resolve/main"
          $files = @("config.json", "model.safetensors", "tokenizer.json", "tokenizer_config.json", "vocab.txt")
          foreach ($f in $files) {
            Write-Host "Downloading $f ..."
            Invoke-WebRequest -Uri "$base/$f" -OutFile "$modelDir/$f"
          }
          '{"use_pytorch_mha":true}' | Out-File -Encoding utf8 "$modelDir/ort_config.json"

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}