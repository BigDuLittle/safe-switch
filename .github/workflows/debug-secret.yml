name: Debug-Secret-Check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Print secret SHA256 (no content leaked)
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "KEY length: ${#KEY}"
          echo "KEY sha256: $(printf '%s' "$KEY" | sha256sum)"
          echo "KEY base64-decoded prefix: $(printf '%s' "$KEY" | base64 -d 2>/dev/null | head -c 60)"
          echo "PASS length: ${#PASS}"
          echo "PASS sha256: $(printf '%s' "$PASS" | sha256sum)"
